- name: Iniciação do serviço de load balancer e das API rest
  hosts: api_db
  become: yes
  gather_facts: true

  vars:
    repo_url: "https://github.com/TimeSync-Grupo-07/API-REST.git"
    repo_dir: "/home/ubuntu/API-REST"
    MYSQL_USER: "usuario_app"
    MYSQL_PASSWORD: "senha_app"

  tasks:
    - name: Clonar repositório API-REST
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dir }}"
        version: main
        update: yes

    - name: Copiar .env.sample para .env
      ansible.builtin.copy:
        src: "{{ repo_dir }}/.env.sample"
        dest: "{{ repo_dir }}/.env"
        remote_src: yes

    - name: Atualizar variável DB_USERNAME no .env
      ansible.builtin.lineinfile:
        path: "{{ repo_dir }}/.env"
        regexp: '^DB_USERNAME='
        line: "DB_USERNAME={{ MYSQL_USER }}"
        create: no

    - name: Atualizar variável DB_PASSWORD no .env
      ansible.builtin.lineinfile:
        path: "{{ repo_dir }}/.env"
        regexp: '^DB_PASSWORD='
        line: "DB_PASSWORD={{ MYSQL_PASSWORD }}"
        create: no

    # ================================
    # Compilar aplicação com Maven
    # ================================
    - name: Compilar aplicação Java com Maven
      ansible.builtin.shell:
        cmd: mvn clean package -DskipTests
        chdir: "{{ repo_dir }}"
      environment:
        MAVEN_OPTS: "-Xmx1024m"
      register: maven_build
      ignore_errors: no

    - name: Exibir saída do build Maven
      ansible.builtin.debug:
        msg: "{{ maven_build.stdout_lines }}"

    # ================================
    # Subir container com Docker Compose
    # ================================
    - name: Subir container com Docker Compose
      ansible.builtin.shell:
        cmd: docker compose up -d
        chdir: "{{ repo_dir }}"
      environment:
        COMPOSE_PROJECT_NAME: "database"

    - name: Verificar containers em execução
      ansible.builtin.shell: docker ps --format "{{'{{.Names}}\t{{.Status}}'}}"
      register: docker_ps_output

    - name: Exibir containers ativos
      ansible.builtin.debug:
        msg: "{{ docker_ps_output.stdout_lines }}"
