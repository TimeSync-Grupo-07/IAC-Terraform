---
- name: Instalação do Node Exporter nos servidores
  hosts: 
    - servidor_web
    - captura_dados
    - api_db
  become: yes
  gather_facts: yes

  vars:
    node_exporter_version: "1.6.1"
    node_exporter_user: "node_exporter"
    node_exporter_bin: "/usr/local/bin/node_exporter"
    node_exporter_service_path: "/etc/systemd/system/node_exporter.service"

  tasks:
    - name: Baixar o Node Exporter
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
        mode: '0644'

    - name: Extrair o Node Exporter
      ansible.builtin.unarchive:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
        dest: "/tmp/"
        remote_src: yes

    - name: Mover o binário para /usr/local/bin
      ansible.builtin.copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: "{{ node_exporter_bin }}"
        mode: '0755'
        remote_src: yes   # 👈 ADICIONADO AQUI
      notify: Reiniciar Node Exporter

    - name: Criar usuário node_exporter
      ansible.builtin.user:
        name: "{{ node_exporter_user }}"
        shell: /bin/false
        system: yes
        create_home: no

    - name: Criar arquivo de serviço systemd
      ansible.builtin.copy:
        dest: "{{ node_exporter_service_path }}"
        content: |
          [Unit]
          Description=Node Exporter
          After=network.target

          [Service]
          User={{ node_exporter_user }}
          Type=simple
          ExecStart={{ node_exporter_bin }}

          [Install]
          WantedBy=multi-user.target
      notify: 
        - Recarregar systemd
        - Reiniciar Node Exporter

    - name: Garantir que o Node Exporter está habilitado e rodando
      ansible.builtin.systemd:
        name: node_exporter
        enabled: yes
        state: started

  handlers:
    - name: Recarregar systemd
      ansible.builtin.systemd:
        daemon_reload: yes

    - name: Reiniciar Node Exporter
      ansible.builtin.systemd:
        name: node_exporter
        state: restarted
