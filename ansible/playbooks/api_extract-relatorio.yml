- name: Iniciação do serviço de API de extração de relatórios
  hosts: api_db
  become: yes
  gather_facts: true

  vars:
    repo_url: "https://github.com/TimeSync-Grupo-07/EXTRACT-RELATORIO.git"
    repo_dir: "/home/ubuntu/EXTRACT-RELATORIO"
    MYSQL_USER: "usuario_app"
    MYSQL_PASSWORD: "senha_app"
  
  tasks:
    - name: Clonar repositório EXTRACT-RELATORIO
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dir }}"
        version: main
        update: yes

    - name: Copiar .env.sample para .env
      ansible.builtin.copy:
        src: "{{ repo_dir }}/.env.sample"
        dest: "{{ repo_dir }}/.env"
        remote_src: yes

    - name: Atualizar variável DB_USER no .env
      ansible.builtin.lineinfile:
        path: "{{ repo_dir }}/.env"
        regexp: '^DB_USER='
        line: "DB_USER={{ MYSQL_USER }}"
        create: no

    - name: Atualizar variável DB_PASS no .env
      ansible.builtin.lineinfile:
        path: "{{ repo_dir }}/.env"
        regexp: '^DB_PASS='
        line: "DB_PASS={{ MYSQL_PASSWORD }}"
        create: no

    - name: Subir container com Docker Compose
      ansible.builtin.shell:
        cmd: docker compose up -d
        chdir: "{{ repo_dir }}"
      environment:
        COMPOSE_PROJECT_NAME: "database"

    - name: Verificar containers em execução
      ansible.builtin.shell: docker ps --format "{{'{{.Names}}\t{{.Status}}'}}"
      register: docker_ps_output

    - name: Exibir containers ativos
      ansible.builtin.debug:
        msg: "{{ docker_ps_output.stdout_lines }}"
