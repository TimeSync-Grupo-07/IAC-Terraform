- name: Iniciação do serviço de captura de E-mail
  hosts: captura_dados
  become: yes
  gather_facts: true

  vars:
    repo_url: "https://github.com/TimeSync-Grupo-07/DATA_READING-Python.git"
    repo_dir: "/home/ubuntu/DATA_READING-Python"
    email_password: "SENHA_DO_APLICATIVO_EMAIL"     # <-- substitua ou passe via --extra-vars
    s3_bucket_name: "NOME_DO_BUCKET"                # <-- substitua ou passe via --extra-vars

  tasks:
    - name: Clonar repositório DATA_READING-Python
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dir }}"
        version: main
        update: yes

    - name: Copiar .env.sample para .env
      ansible.builtin.copy:
        src: "{{ repo_dir }}/.env.sample"
        dest: "{{ repo_dir }}/.env"
        remote_src: yes

    - name: Atualizar variável EMAIL_PASS no .env
      ansible.builtin.lineinfile:
        path: "{{ repo_dir }}/.env"
        regexp: '^EMAIL_PASS='
        line: "EMAIL_PASS={{ email_password }}"
        create: no

    - name: Atualizar variável S3_BUCKET no .env
      ansible.builtin.lineinfile:
        path: "{{ repo_dir }}/.env"
        regexp: '^S3_BUCKET='
        line: "S3_BUCKET={{ s3_bucket_name }}"
        create: no

    - name: Subir container com Docker Compose
      ansible.builtin.shell:
        cmd: docker compose up -d
        chdir: "{{ repo_dir }}"
      environment:
        COMPOSE_PROJECT_NAME: "data_reader"

    - name: Verificar containers em execução
      ansible.builtin.shell: docker ps --format "{{'{{.Names}}\t{{.Status}}'}}"
      register: docker_ps_output

    - name: Exibir containers ativos
      ansible.builtin.debug:
        msg: "{{ docker_ps_output.stdout_lines }}"
