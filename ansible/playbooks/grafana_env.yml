---
- name: Iniciação do serviço do Grafana/Prometheus e Node Exporter
  hosts: monitoramento-controle
  become: yes
  gather_facts: true

  vars:
    repo_url: "https://github.com/TimeSync-Grupo-07/GRAFANA-VISUALIZATION.git"
    repo_dir: "/home/ubuntu/GRAFANA-VISUALIZATION"
    node_exporter_config: "{{ repo_dir }}/config/node_exporter_targets.yml"

  tasks:
    - name: Clonar repositório GRAFANA
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dir }}"
        version: main
        update: yes

    - name: Gerar lista detalhada de hosts (exceto o servidor de monitoramento)
      set_fact:
        node_exporter_hosts: >-
          {{
            (groups['public'] + groups['private'])
            | difference([inventory_hostname])
            | map('extract', hostvars)
            | list
          }}

    - name: Criar arquivo de configuração node_exporter_targets.yml com labels bem formatados
      ansible.builtin.copy:
        dest: "{{ node_exporter_config }}"
        content: |
          {% for host in node_exporter_hosts %}
          - targets:
              - '{{ host.ansible_host }}:9100'
            labels:
              instance: '{{ host.inventory_hostname }}'
              ip: '{{ host.ansible_host }}'
              network_type: '{% if host.inventory_hostname in groups["public"] %}public{% elif host.inventory_hostname in groups["private"] %}private{% else %}unknown{% endif %}'
              description: '{% if host.inventory_hostname == "servidor_web" %}Servidor público responsável por hospedar aplicações web e atuar como proxy reverso.{% elif host.inventory_hostname == "captura_dados" %}Servidor público encarregado da coleta e envio de dados.{% elif host.inventory_hostname == "api_db" %}Servidor privado que executa as APIs e o banco de dados MySQL/PostgreSQL.{% else %}Servidor monitorado sem descrição específica.{% endif %}'
          {% endfor %}
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Subir containers com Docker Compose
      ansible.builtin.shell:
        cmd: docker compose up -d
        chdir: "{{ repo_dir }}"
      environment:
        COMPOSE_PROJECT_NAME: "data_reader"

    - name: Verificar containers em execução
      ansible.builtin.shell: docker ps --format "{{'{{.Names}}\t{{.Status}}'}}"
      register: docker_ps_output

    - name: Exibir containers ativos
      ansible.builtin.debug:
        msg: "{{ docker_ps_output.stdout_lines }}"
