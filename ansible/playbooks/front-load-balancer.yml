---
- name: Implantação do frontend Node.js com Nginx e proxy reverso dinâmico
  hosts: servidor_web        # O host público que hospeda o frontend
  become: yes
  gather_facts: yes

  vars:
    repo_url: "https://github.com/TimeSync-Grupo-07/Data_Visualization-Node.js.git"
    repo_dir: "/home/ubuntu/Data_Visualization-Node.js"
    nginx_conf_path: "{{ repo_dir }}/nginx.conf"

  tasks:
    - name: Clonar repositório Data Visualization
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dir }}"
        version: main
        update: yes

    - name: Obter IP privado do backend (api_db)
      set_fact:
        backend_ip: "{{ hostvars['api_db'].ansible_host }}"

    - name: Substituir IP do backend no nginx.conf
      ansible.builtin.replace:
        path: "{{ nginx_conf_path }}"
        regexp: "proxy_pass http://[0-9\\.]+/api/;"
        replace: "proxy_pass http://{{ backend_ip }}/api/;"
        backup: yes

    - name: Substituir IP do backend no proxy /extract-relatorio/
      ansible.builtin.replace:
        path: "{{ nginx_conf_path }}"
        regexp: "proxy_pass http://[0-9\\.]+:[0-9]+/api/extract-relatorio/;"
        replace: "proxy_pass http://{{ backend_ip }}:5000/api/extract-relatorio/;"
        backup: yes

    - name: Mostrar IP configurado para o backend
      ansible.builtin.debug:
        msg: "O proxy reverso do Nginx agora aponta para o backend {{ backend_ip }}"

    - name: Exibir trecho atualizado do nginx.conf
      ansible.builtin.shell: grep "proxy_pass" {{ nginx_conf_path }}
      register: nginx_proxy_output

    - debug:
        msg: "{{ nginx_proxy_output.stdout_lines }}"

    - name: Subir containers do frontend com Docker Compose
      ansible.builtin.shell:
        cmd: docker compose up -d
        chdir: "{{ repo_dir }}"
      environment:
        COMPOSE_PROJECT_NAME: "data_visualization"

    - name: Verificar containers ativos
      ansible.builtin.shell: docker ps --format "{{'{{.Names}}\t{{.Status}}'}}"
      register: docker_ps_output

    - name: Exibir containers em execução
      ansible.builtin.debug:
        msg: "{{ docker_ps_output.stdout_lines }}"
